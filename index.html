<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I Cavalieri 5F</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(circle at top, #262626 0%, #111 45%, #000 100%);

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 460px;

      text-align: center;

      background: rgba(18,18,18,0.94);

      padding: 35px 25px;

      border-radius: 25px;

      border: 1px solid #333;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.7);
    }

    .logo {
      width: 100%;
      max-width: 390px;
      height: auto;

      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .message {
      font-size: 14px;
      color: #999;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .stars {
      color: #ffc107;
      font-size: 25px;
      letter-spacing: 4px;
      margin-bottom: 13px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 16px;

      margin: 13px 0;

      border-radius: 14px;

      text-decoration: none;

      color: white;

      background: #252525;

      border: 1px solid #3a3a3a;

      font-size: 16px;
      font-weight: bold;

      transition: all 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #333;
    }

    .google {
      background: #ffffff;
      color: #111;

      font-size: 17px;

      border: none;

      box-shadow: 0 8px 25px rgba(255,255,255,0.12);
    }

    .google:hover {
      background: #f1f1f1;
    }

    .instagram {
      background:
        linear-gradient(
          45deg,
          #833ab4,
          #fd1d1d,
          #fcb045
        );

      border: none;
    }

    .tiktok {
      background: #111;
      border: 1px solid #444;
    }

    .website {
      background: #202020;
    }

    .italy {
      display: flex;
      justify-content: center;

      height: 4px;
      width: 90px;

      margin: 0 auto 25px auto;

      overflow: hidden;
      border-radius: 10px;
    }

    .green {
      background: #009246;
      flex: 1;
    }

    .white {
      background: white;
      flex: 1;
    }

    .red {
      background: #ce2b37;
      flex: 1;
    }

    footer {
      margin-top: 24px;

      font-size: 11px;
      color: #666;
    }

  </style>
</head>

<body>

  <div class="container">

    <img
      src="I_CAVALIER_p-1-sap.png"
      alt="I Cavalieri 5F"
      class="logo"
    >

    <div class="italy">
      <div class="green"></div>
      <div class="white"></div>
      <div class="red"></div>
    </div>

    <div class="subtitle">
      Merci pour votre visite ❤️
    </div>

    <div class="message">
      Votre avis compte beaucoup pour nous.<br>
      Retrouvez également I Cavalieri 5F sur nos réseaux.
    </div>

    <div class="stars">
      ★★★★★
    </div>


    <!-- GOOGLE -->

    <a
      class="button google"
      href="https://search.google.com/local/writereview?placeid=ChIJT4dI3o3Cpw0RHjA6_zJ5j-E"
      target="_blank"
      rel="noopener noreferrer"
    >
      ⭐ Donner votre avis sur Google
    </a>

    <!-- SITE -->

    <a
      class="button website"
      href="https://icavalieri5f.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      🌐 Notre site officiel
    </a>


    <!-- INSTAGRAM -->

    <a
      class="button instagram"
      href="https://www.instagram.com/icavalieri5f/"
      target="_blank"
      rel="noopener noreferrer"
    >
      📸 Instagram
    </a>


    <!-- TIKTOK -->

    <a
      class="button tiktok"
      href="https://www.tiktok.com/@icavalieri5f"
      target="_blank"
      rel="noopener noreferrer"
    >
      ♪ TikTok
    </a>


    <footer>
      I Cavalieri 5F • Café • Restaurant • Pizzeria
    </footer>

  </div>

</body>
</html>
